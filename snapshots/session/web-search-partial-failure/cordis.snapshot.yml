# Keyless replay counterpart: the deterministic search provider stays real and
# only the model adapter is replaced by replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro

    - id: web-search-partial-fixture
      name: './web-search-partial-fixture.mjs'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: partial-fixture

- id: web-fetch-http
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
