- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro

    - id: xai-search-incomplete-fixture
      name: './xai-search-incomplete-fixture.mjs'

- insert:
    - id: web-search-xai
      name: '@deepseek-ai/dsh-web-search-xai'
      config:
        apiKey: snapshot-key
        baseURL: http://127.0.0.1:43119/v1
        timeoutMs: 1000

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: xai
    fetchProvider: http
